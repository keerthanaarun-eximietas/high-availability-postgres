
scope: pg-ha-cluster
namespace: /service/
name: ha-postgres-1

restapi:
  listen: 0.0.0.0:8008
  connect_address: ha-postgres-1:8008

etcd3:
  hosts: ha-etcd:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576

    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_log_hints: "on"

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256

postgresql:
  listen: 0.0.0.0:5432
  connect_address: ha-postgres-1:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/17/bin

  authentication:
    superuser:
      username: postgres
      password: "postgres_pass"

    replication:
      username: replicator
      password: "replicator_pass"

  parameters:
    unix_socket_directories: '/var/run/postgresql'
