global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client  1m
    timeout server  1m

frontend postgres_frontend
    bind *:5000
    default_backend postgres_primary

backend postgres_primary
    mode tcp
    option httpchk GET /primary
    http-check expect status 200

    server pg1 ha-postgres-1:5432 check port 8008 inter 2s fall 3 rise 2
    server pg2 ha-postgres-2:5432 check port 8008 inter 2s fall 3 rise 2
